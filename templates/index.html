<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meal Helper</title>
</head>
<body>
<h1>What would you like to eat today?</h1>
<form id="recipe-search">
    <label for="ingredient-input">I have:</label>
    <input id="ingredient-input" placeholder="main ingredient" required>
    <button>Find Recipe</button>
</form>
<script>
    document.getElementById("recipe-search").addEventListener("submit", (event) => {
        event.preventDefault();
        const ingredient = document.getElementById("ingredient-input").value.trim();
        if (ingredient) {
            location.pathname = "/recipe/" + encodeURIComponent(ingredient.toLowerCase().replace(/\s+/g, "_"));
        }
    });
</script>
</body>
</html>
